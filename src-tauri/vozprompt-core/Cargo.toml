[package]
name = "vozprompt-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VozPrompt: logica pura (templates, provedores de IA, pipeline com fallback). Sem dependencia do Tauri."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
keyring = { version = "3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
